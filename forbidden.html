<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not open · Christian Gehrke</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"><meta name="theme-color" content="#4f8fd0">
<link rel="stylesheet" href="/play/play.css">
<style>
/* A page the server shows when there's nothing at an address (the root .htaccess, .github/share.htaccess) */
.lost{max-width:640px;margin:0 auto;padding:12vh 20px 60px}
.lost .kick{margin:0;font:800 13px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.lost h1{margin:10px 0 12px;font-size:clamp(30px,6vw,46px);line-height:1.08}
.lost p{color:var(--ink-2)}
.lost ul{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.lost a.pill{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-weight:700;color:var(--ink);
  transition:border-color .6s ease-in-out,transform .5s ease-in-out}
.lost a.pill:hover{border-color:var(--ink-2);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.lost a.pill{transition:none}.lost a.pill:hover{transform:none}}
</style>
</head>
<body>
<main class="lost">
<p class="kick">christiangehrke.com</p>
<h1>This part of the site isn't open</h1>
<p>Nothing to see here, but plenty elsewhere:</p>
<ul>
<li><a class="pill" href="/">The homepage</a></li>
<li><a class="pill" href="/play/">Play: rides, hikes and drone flights</a></li>
<li><a class="pill" href="/magazine/">The newsstand</a></li>
<li><a class="pill" href="/about/">About Christian</a></li>
</ul>
</main>
</body>
</html>
