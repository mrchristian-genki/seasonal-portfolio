<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>A.L.T.A. kit preview</title>
<style>
/* A.L.T.A.'s parts layered the way GlazyArray's are (assets/alta/KIT.md): the tank with her head erased (rest.webp),
   her tail looping under the ledge (tail.mp4), her head on her collar (head-base, irises in the lens, mouth shapes),
   and an arm gesture laid over her torso (palms.mp4). Every change eases, per the motion rule; reduced motion stills it. */
:root{--bg:#0d1416;--ink:#e8f1ef;--ink2:#9fb4b2;--accent:#3fd0c0;--btn:#1c2a2d;--line:#2c3d40}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef3f2;--ink:#14302e;--ink2:#4a6462;--btn:#fff;--line:#c9d8d6}}
:root[data-theme="dark"]{--bg:#0d1416;--ink:#e8f1ef;--ink2:#9fb4b2;--btn:#1c2a2d;--line:#2c3d40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--ink2);max-width:60ch}
.stage{position:relative;width:100%;max-width:1100px;aspect-ratio:1376/768;overflow:hidden;border-radius:10px;background:#0a1a1c url(parts/rest.webp) center/100% 100% no-repeat}
.stage>*{position:absolute}
.tail{left:0;top:45.833%;width:100%;height:54.167%;object-fit:fill;-webkit-mask:linear-gradient(#0000 0,#000 4%);mask:linear-gradient(#0000 0,#000 4%)}
.palms{left:31.977%;top:0;width:37.209%;height:47.917%;opacity:0;transition:opacity .5s ease-in-out}
.palms.on{opacity:1}
.head{left:41.43%;top:5.947%;width:17.529%;height:30.534%}
.head img{position:absolute;display:block}
.base{inset:0;width:100%;height:100%}
.eyes{position:absolute;left:29.167%;top:47.143%;width:41.667%;height:17.143%;-webkit-mask:url(parts/head-lens.png) 0 0/100% 100% no-repeat;mask:url(parts/head-lens.png) 0 0/100% 100% no-repeat}
.eyes img{inset:0;width:100%;height:100%;transition:transform .8s ease-in-out,filter .9s ease-in-out}
.eyes .glow{position:absolute;inset:0;mix-blend-mode:color;opacity:0;transition:opacity .9s ease-in-out,background-color .9s ease-in-out}
.mouth{position:absolute;left:35.278%;top:67.286%;width:29.583%;height:19%}
.mouth img{inset:0;width:100%;height:100%;opacity:0;transition:opacity 90ms ease-in-out}
.mouth img.on{opacity:1}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:transform .5s ease-in-out,border-color .6s ease-in-out}
button:hover{transform:translateY(-1px);border-color:var(--accent)}
.note{font-size:13px}
@media (prefers-reduced-motion: reduce){.palms,.eyes img,.eyes .glow,.mouth img,button{transition:none}}
</style>
</head>
<body>
<h1>A.L.T.A. kit preview</h1>
<p>Her parts from the renders, layered: the tail loops under the ledge, her irises glance, and her mouth swaps between her own shapes. Not on the site yet.</p>
<div class="stage" id="stage">
  <video class="tail" src="parts/tail.mp4" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
  <video class="palms" id="palms" src="parts/palms.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="head" aria-hidden="true">
    <img class="base" src="parts/head-base.webp" alt="">
    <div class="eyes"><img id="iris" src="parts/head-iris.webp" alt=""><i class="glow" id="glow"></i></div>
    <div class="mouth" id="mouth"></div>
  </div>
</div>
<div class="ctl">
  <button type="button" id="talk">Talk</button>
  <button type="button" id="palmsBtn">Open palms</button>
  <button type="button" data-eyes="amber">Steady amber</button>
  <button type="button" data-eyes="cyan">Cyan-green bloom</button>
  <button type="button" data-eyes="">Her own eyes</button>
</div>
<p class="note">Still to come: her eyes closed (for blinks). "mm" uses her neutral mouth for now.</p>
<script>
(function () {
  'use strict';
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SHAPES = ['smile', 'neutral', 'ah', 'oh', 'laugh', 'oo', 'ee'], M = {}, box = document.getElementById('mouth');
  SHAPES.forEach(function (k) { var i = new Image(); i.src = 'parts/mouth-' + k + '.webp'; i.alt = ''; box.appendChild(i); M[k] = i; });
  var cur = 'smile'; M.smile.classList.add('on');
  function say(k) { if (k === cur) return; M[cur].classList.remove('on'); M[k].classList.add('on'); cur = k; }
  // a talking demo: syllables from her shapes, closing on "mm" (neutral) between words, back to her smile at the end
  var talking = false;
  document.getElementById('talk').onclick = function () {
    if (talking) return; talking = true;
    var seq = [], words = 7 + Math.floor(Math.random() * 4);
    for (var w = 0; w < words; w++) {
      var syl = 1 + Math.floor(Math.random() * 3);
      for (var s = 0; s < syl; s++) seq.push(['ah', 'oh', 'ee', 'oo', 'ah', 'ee'][Math.floor(Math.random() * 6)], 'neutral');
      if (Math.random() < .25) seq.push('neutral');
    }
    seq.push('laugh', 'smile');
    var i = 0;
    (function next() { if (i >= seq.length) { talking = false; return; } say(seq[i++]); setTimeout(next, 120 + Math.random() * 70); })();
  };
  // her irises glance, slowly, inside the lens
  var iris = document.getElementById('iris'), tint = '', dil = 1, gx = 0, gy = 0;
  function paint() { iris.style.transform = 'translate(' + gx + '%,' + gy + '%) scale(' + dil + ')'; iris.style.filter = tint; }
  if (!still) (function glance() {
    var r = Math.random(); gx = r < .35 ? 0 : (Math.random() - .5) * 7; gy = (Math.random() - .5) * 4; paint();
    setTimeout(glance, 2200 + Math.random() * 3200);
  })();
  // her notes: a steady amber for littering, a cyan-green bloom for a good call; the rings narrow or dilate
  [].forEach.call(document.querySelectorAll('[data-eyes]'), function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-eyes');
      // the colour layer gives her irises one hue and keeps their own light and shade; brightness makes them glow
      var g = document.getElementById('glow');
      if (k) g.style.backgroundColor = k === 'amber' ? '#ffb020' : '#2fe8c0';
      g.style.opacity = k ? '.85' : '0';
      tint = k ? 'brightness(1.3) saturate(1.3)' : '';
      dil = k === 'amber' ? .9 : k === 'cyan' ? 1.08 : 1; paint();
    };
  });
  // the gesture fades in over her torso, plays once, and fades back to the still
  var pv = document.getElementById('palms');
  document.getElementById('palmsBtn').onclick = function () { pv.currentTime = 0; pv.classList.add('on'); pv.play(); };
  pv.addEventListener('timeupdate', function () { if (pv.duration && pv.currentTime > pv.duration - .6) pv.classList.remove('on'); });
})();
</script>
</body>
</html>
