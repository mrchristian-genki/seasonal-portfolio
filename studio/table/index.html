<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio table · test</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="table.css?v=15">
</head>
<body class="table-page">
<main>
  <div class="table" id="table" aria-label="The Studio work table, seen from above">
    <img class="wood day" src="a/table-day.webp" alt="">
    <img class="wood night" src="a/table-night.webp" alt="">
    <div class="lamp-pool" aria-hidden="true"></div>
    <div class="layer" id="layer"></div>
    <div class="shade" aria-hidden="true"></div>
  </div>
  <nav class="controls" aria-label="Try the table">
    <button type="button" data-act="night">Night</button>
    <button type="button" data-act="drop">Drop photos</button>
    <button type="button" data-act="process" class="primary">Process Content</button>
    <button type="button" data-act="take">Take one away</button>
    <button type="button" data-act="handin">Hand one in</button>
    <button type="button" data-act="marley">Marley</button>
    <button type="button" data-act="reset">Start over</button>
  </nav>
  <p class="note">A test of the Studio's work table: props arrive on their own, a hand takes them away, your photos land as prints, and the green lamp lights when an upgrade comes back.</p>
</main>
<script src="table.js?v=16"></script>
</body>
</html>
