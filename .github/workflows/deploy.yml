# Deploy the site to DreamHost over SSH (rsync), so nothing has to be zipped and uploaded by hand.
#
# Runs on every push to main, or by hand from the Actions tab ("Run workflow"), where "dry run"
# lists what would change without touching the server. Only adds and updates files: nothing on the
# server is ever deleted, so files that live only there are safe. field/ (the private Field Notes
# manager, drafts and notes) is never uploaded; the public pages are built into play/. The Studio's
# private settings live outside the web folder (~/studio-private) and are never touched.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   DH_HOST     the server, e.g. iad1-shared-b8-12.dreamhost.com (DreamHost panel -> SFTP/SSH users)
#   DH_USER     the SSH user for the site
#   DH_PATH     the folder to deploy into, e.g. /home/<user>/christiangehrke.com
#   DH_SSH_KEY  the private deploy key (its public half is in ~/.ssh/authorized_keys on DreamHost)
name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would change, upload nothing"
        type: boolean
        default: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each published Field Note's share card: its cover with the title on a brass nameplate (cards.py),
      # made fresh on every deploy so a Note published from the Studio gets one too.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make the share cards
        run: |
          python -m pip install --quiet pillow
          python field/tools/cards.py

      # Play is rebuilt from field/data on every deploy, so an entry saved or published from the
      # Studio goes live without anyone running publish.mjs by hand.
      - name: Build Play
        run: node field/tools/publish.mjs

      # The Studio: its copy of the track engine, and the Anthropic PHP SDK (composer.lock pins it).
      - name: Prepare the Studio
        run: |
          cp field/track.js studio/assets/track.js
          composer install --working-dir=studio --no-dev --no-interaction --prefer-dist --optimize-autoloader
          printf 'Require all denied\n' > studio/vendor/.htaccess

      - name: Set up SSH
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DH_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload changed files
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          for v in DH_HOST DH_USER DH_PATH; do [ -n "${!v}" ] || { echo "Missing secret $v"; exit 1; }; done
          rsync -rlvz --checksum --chmod=D755,F644 $DRY --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='*.md' \
            --exclude='upload-*.zip' \
            --exclude='field/' \
            --exclude='studio/composer.*' \
            ./ "$DH_USER@$DH_HOST:$DH_PATH/"

      # Shared homepage addresses that open a Note get that Note's share card (share.php). The rule lives in
      # the root .htaccess, which may already hold the host's own settings, so only our marked block is
      # replaced (or added at the end) and the rest is left as it is.
      - name: Route shared Note addresses to their share card
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DH_USER@$DH_HOST" "cd '$DH_PATH' && touch .htaccess && awk '/^# BEGIN note-share/{s=1} !s{print} /^# END note-share/{s=0}' .htaccess > .htaccess.new && cat >> .htaccess.new && chmod 644 .htaccess.new && mv .htaccess.new .htaccess && grep -c 'note-share' .htaccess" < .github/share.htaccess
